pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "DeLoreanStation"
include ':app'

// Emulator-Kern (LibretroDroid, GPL-3). Wird vom Build-Workflow nach external/ geklont.
include ':libretrodroid'
project(':libretrodroid').projectDir = file('external/libretrodroid/libretrodroid')

// OpenBOR-Engine (BSD). Wird vom Build-Workflow nach external/openbor geklont.
if (file('external/openbor/engine/android/app/jni/Android.mk').exists()) {
    include ':openbor'
    project(':openbor').projectDir = file('openbor-module')
}
