name: DeLorean Station bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK, NDK und CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "cmake;3.22.1" "ndk;26.1.10909125" "ndk;21.4.7075529" "build-tools;34.0.0" "platforms;android-33" "platforms;android-35" > /dev/null

      - name: LibretroDroid holen (Emulator-Kern, GPL-3)
        run: |
          git clone --depth 1 --branch 0.14.0 --recurse-submodules --shallow-submodules \
            https://github.com/Swordfish90/LibretroDroid external/libretrodroid
          # Erweiterungen für Netplay und Seitenverhältnis
          git -C external/libretrodroid apply ../../patches/libretrodroid.patch
          # NDK-Version festlegen
          sed -i 's/compileSdkVersion 33/compileSdkVersion 33\n    ndkVersion "26.1.10909125"/' external/libretrodroid/libretrodroid/build.gradle

      - name: OpenBOR holen (Engine, BSD-Lizenz)
        run: |
          git init -q external/openbor
          git -C external/openbor fetch -q --depth 1 https://github.com/DCurrent/openbor 65a7f0b41aee87fe4084e538634b4ed73236f871
          git -C external/openbor checkout -q FETCH_HEAD

      - name: Libretro-Cores laden
        run: bash scripts/fetch_cores.sh

      - name: APKs bauen (32-bit und 64-bit)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: APKs umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/DeLoreanStation-32bit.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/DeLoreanStation-64bit.apk
          cp cores-report.txt out/Cores.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: station-build-${{ github.run_number }}
          name: DeLorean Station Build ${{ github.run_number }}
          body: "DeLoreanStation-32bit.apk und DeLoreanStation-64bit.apk einzeln. Eingebaute Emulatoren siehe Cores.txt. Created by DeLorean23"
          files: |
            out/DeLoreanStation-32bit.apk
            out/DeLoreanStation-64bit.apk
            out/Cores.txt
          make_latest: true

      - name: Fehlerprotokoll speichern
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          (tail -c 60000 build-log.txt 2>/dev/null || echo "kein Log") > /tmp/log.txt
          git checkout -B build-logs
          git rm -rq --cached . || true
          cp /tmp/log.txt station-build-log.txt
          git add -f station-build-log.txt
          git commit -m "Build-Log ${{ github.run_number }}"
          git push -f origin build-logs
