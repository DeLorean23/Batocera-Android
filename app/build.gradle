plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'de.delorean23.station'
    compileSdk 35

    defaultConfig {
        applicationId 'de.delorean23.station'
        minSdk 21
        targetSdk 34
        // Build-Nummer aus GitHub Actions = Versionsnummer (für die Update-Prüfung)
        def build = (System.getenv('BUILD_NUMBER') ?: '1') as int
        versionCode build
        versionName "1.2 (Build ${build})"
        buildConfigField 'int', 'BUILD_NUMBER', "${build}"
    }

    // Zwei getrennte APKs: 32-bit (armeabi-v7a) und 64-bit (arm64-v8a)
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    signingConfigs {
        station {
            // Fester Schlüssel, damit neue Versionen über alte installiert werden können
            storeFile file('delorean-station.keystore')
            storePassword 'delorean23'
            keyAlias 'station'
            keyPassword 'delorean23'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.station
        }
        debug {
            signingConfig signingConfigs.station
        }
    }

    packaging {
        jniLibs {
            // Cores müssen als echte Dateien im lib-Ordner liegen (dlopen)
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/*.kotlin_module']
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            if (rootProject.file('external/openbor/engine/android/app/jni/Android.mk').exists()) {
                java.srcDirs += 'src/openbor/java'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':libretrodroid')
    if (rootProject.findProject(':openbor') != null) {
        implementation project(':openbor')
    }
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // SMB-Netzwerkfreigaben (NAS)
    implementation 'com.hierynomus:smbj:0.13.0'
    // SVG-Logos aus dem Theme
    implementation 'com.caverock:androidsvg-aar:1.4'
    // 7z-Archive (wie RetroArch bei Batocera)
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'
    // zstd für die Pakete des Batocera-Stores (Content-Downloader)
    implementation 'com.github.luben:zstd-jni:1.5.6-3@aar'
}
